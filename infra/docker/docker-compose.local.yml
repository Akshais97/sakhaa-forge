services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: v0
      POSTGRES_USER: v0_migration
      POSTGRES_PASSWORD: local_only
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
